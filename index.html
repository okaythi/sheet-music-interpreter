<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Debussy: Suite bergamasque, L. 75 — III. Clair de lune (Standalone Engine)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="score-header">
      <div class="title-group">
        <h1>Claude Debussy: Clair de lune (Suite bergamasque, L. 75)</h1>
        <p>Full Unabridged 72 Measures · Standalone Notation & Two-Clock Playback Engine</p>
      </div>
      <div class="badge-bar">
        <span class="tag-badge">D♭ Major · 9/8</span>
        <span class="tag-badge badge-blue">Two Clocks Web Audio</span>
        <span class="tag-badge" id="badge-consordina">con sordina</span>
      </div>
    </header>

    <!-- Main Score Card -->
    <div class="score-card">
      <!-- Section Quick-Jump Pills -->
      <nav class="section-nav-bar">
        <button class="sec-pill active" data-sys="1">Theme A (Bars 1–14)</button>
        <button class="sec-pill" data-sys="8">Tempo rubato (Bars 15–26)</button>
        <button class="sec-pill" data-sys="14">Calmato (Bars 27–42)</button>
        <button class="sec-pill" data-sys="22">Animato Climax (Bars 43–50)</button>
        <button class="sec-pill" data-sys="26">Recap (Bars 51–65)</button>
        <button class="sec-pill" data-sys="34">Coda (Bars 66–72)</button>
      </nav>

      <!-- System Stepper & HUD -->
      <div class="system-nav">
        <div class="stepper-group">
          <button class="step-btn" id="btn-prev-sys">◀ Prev</button>
          <span class="current-sys-badge" id="current-sys-title">System 1 of 36 (Bars 1 & 2)</span>
          <button class="step-btn" id="btn-next-sys">Next ▶</button>
          <button class="auto-page-toggle active" id="btn-autopage">Auto-Paging: ON</button>
        </div>

        <div class="score-hud">
          <div class="pedal-indicator" id="pedal-indicator">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="10"/>
            </svg>
            <span>PEDAL RESONANCE</span>
          </div>
          <span class="hud-time" id="hud-time">00:00 / 04:30.00</span>
        </div>
      </div>

      <!-- Score Viewport -->
      <div class="score-viewport">
        <svg id="sheet-svg" class="sheet-svg" viewBox="0 0 1020 200" preserveAspectRatio="none"></svg>
      </div>

      <!-- Controls Tray -->
      <div class="controls-tray">
        <div class="scrubber-track" id="scrubber-track">
          <div class="scrubber-fill" id="scrubber-fill">
            <div class="scrubber-thumb"></div>
          </div>
        </div>
        <div class="time-readout">
          <span id="time-current">00:00</span>
          <span id="time-total">04:30.00</span>
        </div>

        <div class="buttons-row">
          <div class="btn-group-left">
            <button class="btn btn-primary" id="btn-play">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <span>Play</span>
            </button>
            <button class="btn" id="btn-reset">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              </svg>
              <span>Reset</span>
            </button>
            <button class="btn active" id="btn-sound">Acoustic Piano: ON</button>
          </div>

          <div class="timing-select-group">
            <label for="timing-strategy-select">Timing:</label>
            <select id="timing-strategy-select" class="timing-select">
              <option value="rubato" selected>Expressive Rubato</option>
              <option value="metronome">Strict Metronome (48 BPM)</option>
              <option value="dtw">Audio-Aligned (DTW)</option>
            </select>
          </div>

          <div class="stepper-group">
            <div class="speed-pills">
              <button class="speed-pill" data-speed="0.5">0.5×</button>
              <button class="speed-pill" data-speed="0.75">0.75×</button>
              <button class="speed-pill active" data-speed="1.0">1.0×</button>
              <button class="speed-pill" data-speed="1.25">1.25×</button>
            </div>
            <button class="btn" id="btn-loop">Loop</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
